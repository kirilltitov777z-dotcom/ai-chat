plugins {
    id 'com.android.application'
}

android {
    namespace 'io.margy.aichat'
    compileSdk 34
    defaultConfig {
        applicationId 'io.margy.aichat'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
