name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK (release, signed)
        run: gradle -p android-app assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/release/app-release.apk AI-Chat.apk
          ls -lh AI-Chat.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LotiChat-apk
          path: AI-Chat.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk AI-Chat.apk --clobber
            gh release edit apk --latest \
              --title "LotiChat — APK" \
              --notes "v2.0 — полностью нативная версия на Kotlin + Jetpack Compose (Material You 3). Скачивай без логина и устанавливай."
          else
            gh release create apk AI-Chat.apk \
              --title "LotiChat — APK" \
              --notes "v2.0 — полностью нативная версия на Kotlin + Jetpack Compose (Material You 3). Скачивай без логина и устанавливай." \
              --latest
          fi
