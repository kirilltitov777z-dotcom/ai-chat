name: build-apk

on: [workflow_dispatch]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p android-app assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk AI-Chat.apk
          ls -lh AI-Chat.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk AI-Chat.apk --clobber
            gh release edit apk --latest
          else
            gh release create apk AI-Chat.apk \
              --title "AI Чат — APK" \
              --notes "Свежая сборка приложения. Скачивай без логина, устанавливай как обычное приложение." \
              --latest
          fi
