name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK (release, signed)
        run: gradle -p android-app assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/release/app-release.apk LokiChat.apk
          ls -lh LokiChat.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LokiChat-apk
          path: LokiChat.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk LokiChat.apk --clobber
            gh release edit apk --latest \
              --title "LokiChat 1.0 — APK" \
              --notes "LokiChat 1.0 — бесплатный ИИ-чат. Работает сразу без ключа (Pollinations), свой DNS-резолвер, адаптивная иконка, Material You 3."
          else
            gh release create apk LokiChat.apk \
              --title "LokiChat 1.0 — APK" \
              --notes "LokiChat 1.0 — бесплатный ИИ-чат. Работает сразу без ключа (Pollinations), свой DNS-резолвер, адаптивная иконка, Material You 3." \
              --latest
          fi
