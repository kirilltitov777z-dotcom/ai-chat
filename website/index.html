<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LokiChat — бесплатный ИИ-чат</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #121016;
            color: #E6E1E9;
            line-height: 1.5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .logo {
            width: 48px;
            height: 48px;
            background: #7C3AED;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .logo svg {
            width: 24px;
            height: 24px;
            fill: white;
        }
        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #FFFFFF;
        }
        .subtitle {
            font-size: 16px;
            color: #8899AA;
            margin-bottom: 24px;
        }
        .chat {
            background: #121016;
            border-radius: 16px;
            padding: 16px;
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #2A2E3C;
            margin-bottom: 20px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            max-width: 80%;
            font-size: 14px;
        }
        .message.user {
            background: #7C3AED;
            color: white;
            align-self: flex-end;
        }
        .message.ai {
            background: #1E1B24;
            color: #E6E1E9;
            align-self: flex-start;
        }
        .input-area {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }
        .input-text {
            flex: 1;
            background: #1E1B24;
            border: 1px solid #2A2E3C;
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .btn-send {
            background: #7C3AED;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-send:disabled {
            opacity: 0.6;
        }
        .status {
            margin-top: 8px;
            font-size: 13px;
            color: #8899AA;
            min-height: 16px;
        }
        .download-section {
            margin-top: 30px;
            padding: 24px;
            background: #121016;
            border-radius: 16px;
            border: 1px solid #2A2E3C;
        }
        .download-section h2 {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #FFFFFF;
        }
        .download-section p {
            font-size: 14px;
            color: #8899AA;
            margin-bottom: 16px;
        }
        .btn-download {
            background: #7C3AED;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .btn-download:hover {
            background: #8B5CF6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M22,28h64c6.6,0 12,5.4 12,12v28c0,6.6 -5.4,12 -12,12H22c-6.6,0 -12,-5.4 -12,-12V40c0,-6.6 5.4,-12 12,-12z" />
                <circle cx="42" cy="52" r="4" fill="#7C3AED"/>
                <circle cx="54" cy="52" r="4" fill="#7C3AED"/>
                <circle cx="66" cy="52" r="4" fill="#7C3AED"/>
            </svg>
        </div>
        <h1>LokiChat</h1>
        <p class="subtitle">Бесплатный ИИ-чат без ключа и регистрации</p>

        <div class="chat" id="chatBox">
            <div class="message ai">Привет! Я Loki — бесплатный ИИ-ассистент. Работаю прямо в браузере без ключа и регистрации.</div>
        </div>

        <div class="input-area">
            <input type="text" id="inputText" class="input-text" placeholder="Напиши сообщение...">
            <button class="btn-send" id="btnSend">Отправить</button>
        </div>
        <div class="status" id="status"></div>

        <div class="download-section">
            <h2>Скачать приложение</h2>
            <p>Нативное приложение для Android с Material You дизайном, локальной моделью и экспортом чатов.</p>
            <a href="https://github.com/kirilltitov777z-dotcom/ai-chat/releases/latest/download/LokiChat.apk" class="btn-download">Скачать LokiChat.apk</a>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const inputText = document.getElementById('inputText');
        const btnSend = document.getElementById('btnSend');
        const status = document.getElementById('status');

        async function sendMessage() {
            const text = inputText.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            inputText.value = '';
            btnSend.disabled = true;
            status.textContent = 'Отправляю...';

            try {
                const response = await fetch('https://text.pollinations.ai/openai/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'openai',
                        messages: [{ role: 'user', content: text }],
                        stream: false,
                        max_tokens: 500
                    })
                });

                if (!response.ok) {
                    throw new Error('Ошибка сервера: ' + response.status);
                }

                const data = await response.json();
                const aiText = data.choices?.[0]?.message?.content || 'Ошибка: пустой ответ';
                addMessage(aiText, 'ai');
            } catch (err) {
                addMessage('Ошибка: ' + err.message, 'ai');
            } finally {
                btnSend.disabled = false;
                status.textContent = '';
                inputText.focus();
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = 'message ' + sender;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        btnSend.addEventListener('click', sendMessage);
        inputText.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
